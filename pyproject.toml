[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tapedeck"
version = "0.2.0"
description = "Record and replay coding-agent CLIs (Claude Code, Codex, Gemini CLI), including the files they write, for fast deterministic tests."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Prime-agentai" }]
keywords = ["claude-code", "ai-agents", "testing", "vcr", "cassette", "record-replay", "codex", "gemini-cli", "pytest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tapedeck = "tapedeck.cli:main"

[project.entry-points.pytest11]
"tapedeck.pytest_plugin" = "tapedeck.pytest_plugin"

[project.urls]
Homepage = "https://github.com/Prime-agentai/agent-tapedeck"
Issues = "https://github.com/Prime-agentai/agent-tapedeck/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tapedeck = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p tapedeck.pytest_plugin"
pythonpath = ["src"]
